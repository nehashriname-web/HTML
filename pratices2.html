<!DOCTYPE html>
<html>
<head>
<title>Create Profile</title>

<style>
body{
    font-family: Arial;
}

h2{
    text-align: center;
}

.main{
    width: 900px;
    margin: auto;
}

.row{
    margin-bottom: 15px;
}

label{
    display: inline-block;
    width: 170px;
    font-weight: bold;
}

input[type="text"],
input[type="number"],
input[type="date"]{
    width: 200px;
    height: 25px;
}

textarea{
    width: 400px;
    height: 100px;
    vertical-align: top;
}

.red{
    color: red;
    font-weight: bold;
}

button{
    padding: 5px 20px;
}
</style>
</head>

<body>

<h2>Create Profile</h2>

<div class="main">
<form>

<div class="row">
<label>First Name:</label>
<input type="text" placeholder="First Name">
</div>

<div class="row">
<label>Last Name:</label>
<input type="text" placeholder="Last Name">
</div>

<div class="row">
<label>Date of Birth:</label>
<input type="date" required>
</div>

<div class="row">
<label>Enter your Gender:</label>
<input type="radio" name="gender" checked required> Male
<input type="radio" name="gender"> Female
</div>

<div class="row">
<label>Age:</label>
<input type="number" placeholder="Age">
</div>

<div class="row">
<label>Permanent Address:</label>
<textarea required></textarea>
</div>

<div class="row">
<label>Current Address:</label>
<textarea required></textarea>
</div>

<div class="row" style="text-align:center;">
<button type="submit">Create</button>
</div>

</form>
</div>

</body>
</html>
